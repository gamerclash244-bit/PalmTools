<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR Code Builder — PALMTOOLS</title>
  <link rel="stylesheet" href="../shared.css"/>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    .qr-preview-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .qr-canvas-wrap {
      padding: 20px;
      background: white;
      border-radius: 18px;
      box-shadow: var(--shadow-hover);
      display: inline-block;
      line-height: 0;
    }
    #qrCanvas {
      border-radius: 4px;
      display: block;
    }
    .qr-empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 40px 0;
      color: var(--text-faint);
    }
    .qr-empty-icon { font-size: 48px; opacity: 0.4; }
    .qr-empty-text {
      font-size: 14px;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
    }
    .size-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .size-badge {
      padding: 8px 16px;
      border-radius: 50px;
      border: 1.5px solid var(--border-subtle);
      background: var(--surface-2);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.18s;
      font-family: 'DM Sans', sans-serif;
    }
    .size-badge.active, .size-badge:hover {
      border-color: var(--orange);
      background: var(--orange-glow);
      color: var(--orange);
    }
    .error-correction-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .ec-btn {
      padding: 8px 16px;
      border-radius: 50px;
      border: 1.5px solid var(--border-subtle);
      background: var(--surface-2);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.18s;
      font-family: 'DM Sans', sans-serif;
    }
    .ec-btn.active, .ec-btn:hover {
      border-color: var(--orange);
      background: var(--orange-glow);
      color: var(--orange);
    }
    .range-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .range-val {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: var(--orange);
      min-width: 36px;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="tool-page">
    <!-- Nav -->
    <nav class="tool-nav">
      <a class="back-btn" href="../index.html">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
        Back to PALMTOOLS
      </a>
    </nav>

    <!-- Header -->
    <header class="tool-header">
      <div class="tool-icon-badge">⬛</div>
      <h1 class="tool-title">QR Code <span class="accent">Builder</span></h1>
      <p class="tool-subtitle">Generate QR codes from any URL, text, or contact info. Customize and download instantly.</p>
    </header>

    <!-- Input Card -->
    <div class="card">
      <div class="card-title">Content</div>
      <div class="field">
        <label class="label">Text or URL</label>
        <textarea class="input" id="qrInput" placeholder="https://example.com  or  any text…" rows="3" style="min-height:90px;" oninput="scheduleGenerate()"></textarea>
      </div>
      <div class="field">
        <label class="label">Error Correction Level</label>
        <div class="error-correction-row" id="ecRow">
          <button class="ec-btn active" data-ec="L" onclick="setEC(this, 'L')">L — Low</button>
          <button class="ec-btn" data-ec="M" onclick="setEC(this, 'M')">M — Medium</button>
          <button class="ec-btn" data-ec="Q" onclick="setEC(this, 'Q')">Q — Quartile</button>
          <button class="ec-btn" data-ec="H" onclick="setEC(this, 'H')">H — High</button>
        </div>
      </div>
    </div>

    <!-- Style Card -->
    <div class="card">
      <div class="card-title">Appearance</div>
      <div class="row">
        <div class="col field">
          <label class="label">QR Color</label>
          <div class="swatch-row">
            <input type="color" id="colorDark" value="#1C1917" oninput="scheduleGenerate()" />
            <span class="swatch-item">Foreground</span>
          </div>
        </div>
        <div class="col field">
          <label class="label">Background</label>
          <div class="swatch-row">
            <input type="color" id="colorLight" value="#ffffff" oninput="scheduleGenerate()" />
            <span class="swatch-item">Background</span>
          </div>
        </div>
      </div>
      <div class="field">
        <label class="label">Size (px)</label>
        <div class="size-badges" id="sizeBadges">
          <button class="size-badge" data-size="128" onclick="setSize(this, 128)">128</button>
          <button class="size-badge active" data-size="256" onclick="setSize(this, 256)">256</button>
          <button class="size-badge" data-size="512" onclick="setSize(this, 512)">512</button>
          <button class="size-badge" data-size="1024" onclick="setSize(this, 1024)">1024</button>
        </div>
      </div>
      <div class="field">
        <label class="label">Margin — <span id="marginVal">2</span> modules</label>
        <div class="range-row">
          <input type="range" id="marginRange" min="0" max="6" value="2" oninput="document.getElementById('marginVal').textContent=this.value; scheduleGenerate()" />
        </div>
      </div>
    </div>

    <!-- Preview Card -->
    <div class="card">
      <div class="card-title">Preview</div>
      <div class="qr-preview-section" id="previewSection">
        <div class="qr-empty-state" id="emptyState">
          <div class="qr-empty-icon">⬛</div>
          <div class="qr-empty-text">Type something above to generate your QR code</div>
        </div>
        <div id="qrResult" style="display:none; flex-direction:column; align-items:center; gap:20px;">
          <div class="qr-canvas-wrap">
            <canvas id="qrCanvas"></canvas>
          </div>
          <div class="actions">
            <button class="btn btn-primary" onclick="downloadQR()">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Download PNG
            </button>
            <button class="btn btn-secondary" onclick="copyQR()">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              Copy Image
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentEC = 'L';
    let currentSize = 256;
    let generateTimer = null;

    function setEC(btn, ec) {
      currentEC = ec;
      document.querySelectorAll('.ec-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      scheduleGenerate();
    }

    function setSize(btn, size) {
      currentSize = size;
      document.querySelectorAll('.size-badge').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      scheduleGenerate();
    }

    function scheduleGenerate() {
      clearTimeout(generateTimer);
      generateTimer = setTimeout(generate, 250);
    }

    function generate() {
      const text = document.getElementById('qrInput').value.trim();
      const emptyState = document.getElementById('emptyState');
      const qrResult = document.getElementById('qrResult');

      if (!text) {
        emptyState.style.display = 'flex';
        qrResult.style.display = 'none';
        return;
      }

      const canvas = document.getElementById('qrCanvas');
      const darkColor = document.getElementById('colorDark').value;
      const lightColor = document.getElementById('colorLight').value;
      const margin = parseInt(document.getElementById('marginRange').value);

      QRCode.toCanvas(canvas, text, {
        errorCorrectionLevel: currentEC,
        width: currentSize,
        margin: margin,
        color: { dark: darkColor, light: lightColor }
      }, (err) => {
        if (err) {
          console.error(err);
          return;
        }
        emptyState.style.display = 'none';
        qrResult.style.display = 'flex';
      });
    }

    function downloadQR() {
      const canvas = document.getElementById('qrCanvas');
      const text = document.getElementById('qrInput').value.trim().slice(0,30).replace(/[^a-zA-Z0-9]/g,'_') || 'qrcode';
      const link = document.createElement('a');
      link.download = `palmtools_qr_${text}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    async function copyQR() {
      const canvas = document.getElementById('qrCanvas');
      canvas.toBlob(async (blob) => {
        try {
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
          const btn = event.target.closest('.btn');
          const orig = btn.innerHTML;
          btn.innerHTML = '✓ Copied!';
          setTimeout(() => btn.innerHTML = orig, 2000);
        } catch(e) {
          alert('Copy to clipboard not supported in this browser. Please use Download instead.');
        }
      });
    }
  </script>
</body>
</html>
