<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Text to PDF — PALMTOOLS</title>
  <link rel="stylesheet" href="../shared.css"/>
  
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <style>
    /* Quill Editor PALMTOOLS Overrides */
    .editor-wrapper {
      background: var(--surface);
      border-radius: 12px;
      margin-top: 8px;
    }
    .ql-toolbar.ql-snow {
      border: 1.5px solid var(--border-subtle);
      border-bottom: none;
      border-radius: 12px 12px 0 0;
      background: var(--surface-2);
      font-family: 'DM Sans', sans-serif;
      padding: 12px;
    }
    .ql-container.ql-snow {
      border: 1.5px solid var(--border-subtle);
      border-radius: 0 0 12px 12px;
      background: var(--bg-2);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: var(--text);
      min-height: 400px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .ql-container.ql-snow.focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px var(--orange-glow);
    }
    .ql-editor {
      min-height: 400px;
      line-height: 1.75;
      padding: 24px;
    }
    .ql-editor img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 10px 0;
    }
    
    /* Toolbar active states */
    .ql-snow.ql-toolbar button:hover, 
    .ql-snow .ql-toolbar button:hover, 
    .ql-snow.ql-toolbar button.ql-active, 
    .ql-snow .ql-toolbar button.ql-active, 
    .ql-snow.ql-toolbar .ql-picker-label:hover, 
    .ql-snow .ql-toolbar .ql-picker-label:hover, 
    .ql-snow.ql-toolbar .ql-picker-label.ql-active, 
    .ql-snow .ql-toolbar .ql-picker-label.ql-active, 
    .ql-snow.ql-toolbar .ql-picker-item:hover, 
    .ql-snow .ql-toolbar .ql-picker-item:hover, 
    .ql-snow.ql-toolbar .ql-picker-item.ql-selected, 
    .ql-snow .ql-toolbar .ql-picker-item.ql-selected {
      color: var(--orange);
    }
    .ql-snow.ql-toolbar button:hover .ql-fill, .ql-snow .ql-toolbar button:hover .ql-fill, 
    .ql-snow.ql-toolbar button.ql-active .ql-fill, .ql-snow .ql-toolbar button.ql-active .ql-fill, 
    .ql-snow.ql-toolbar .ql-picker-label:hover .ql-fill, .ql-snow .ql-toolbar .ql-picker-label:hover .ql-fill, 
    .ql-snow.ql-toolbar .ql-picker-label.ql-active .ql-fill, .ql-snow .ql-toolbar .ql-picker-label.ql-active .ql-fill, 
    .ql-snow.ql-toolbar .ql-picker-item:hover .ql-fill, .ql-snow .ql-toolbar .ql-picker-item:hover .ql-fill, 
    .ql-snow.ql-toolbar .ql-picker-item.ql-selected .ql-fill, .ql-snow .ql-toolbar .ql-picker-item.ql-selected .ql-fill, 
    .ql-snow.ql-toolbar button:hover .ql-stroke.ql-fill, .ql-snow .ql-toolbar button:hover .ql-stroke.ql-fill, 
    .ql-snow.ql-toolbar button.ql-active .ql-stroke.ql-fill, .ql-snow .ql-toolbar button.ql-active .ql-stroke.ql-fill, 
    .ql-snow.ql-toolbar .ql-picker-label:hover .ql-stroke.ql-fill, .ql-snow .ql-toolbar .ql-picker-label:hover .ql-stroke.ql-fill, 
    .ql-snow.ql-toolbar .ql-picker-label.ql-active .ql-stroke.ql-fill, .ql-snow .ql-toolbar .ql-picker-label.ql-active .ql-stroke.ql-fill, 
    .ql-snow.ql-toolbar .ql-picker-item:hover .ql-stroke.ql-fill, .ql-snow .ql-toolbar .ql-picker-item:hover .ql-stroke.ql-fill, 
    .ql-snow.ql-toolbar .ql-picker-item.ql-selected .ql-stroke.ql-fill, .ql-snow .ql-toolbar .ql-picker-item.ql-selected .ql-stroke.ql-fill {
      fill: var(--orange);
    }
    .ql-snow.ql-toolbar button:hover .ql-stroke, .ql-snow .ql-toolbar button:hover .ql-stroke, 
    .ql-snow.ql-toolbar button.ql-active .ql-stroke, .ql-snow .ql-toolbar button.ql-active .ql-stroke, 
    .ql-snow.ql-toolbar .ql-picker-label:hover .ql-stroke, .ql-snow .ql-toolbar .ql-picker-label:hover .ql-stroke, 
    .ql-snow.ql-toolbar .ql-picker-label.ql-active .ql-stroke, .ql-snow .ql-toolbar .ql-picker-label.ql-active .ql-stroke, 
    .ql-snow.ql-toolbar .ql-picker-item:hover .ql-stroke, .ql-snow .ql-toolbar .ql-picker-item:hover .ql-stroke, 
    .ql-snow.ql-toolbar .ql-picker-item.ql-selected .ql-stroke, .ql-snow .ql-toolbar .ql-picker-item.ql-selected .ql-stroke, 
    .ql-snow.ql-toolbar button:hover .ql-stroke-miter, .ql-snow .ql-toolbar button:hover .ql-stroke-miter, 
    .ql-snow.ql-toolbar button.ql-active .ql-stroke-miter, .ql-snow .ql-toolbar button.ql-active .ql-stroke-miter, 
    .ql-snow.ql-toolbar .ql-picker-label:hover .ql-stroke-miter, .ql-snow .ql-toolbar .ql-picker-label:hover .ql-stroke-miter, 
    .ql-snow.ql-toolbar .ql-picker-label.ql-active .ql-stroke-miter, .ql-snow .ql-toolbar .ql-picker-label.ql-active .ql-stroke-miter, 
    .ql-snow.ql-toolbar .ql-picker-item:hover .ql-stroke-miter, .ql-snow .ql-toolbar .ql-picker-item:hover .ql-stroke-miter, 
    .ql-snow.ql-toolbar .ql-picker-item.ql-selected .ql-stroke-miter, .ql-snow .ql-toolbar .ql-picker-item.ql-selected .ql-stroke-miter {
      stroke: var(--orange);
    }
    
    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
    }
    .preview-iframe-wrapper {
      margin-top: 20px;
      height: 600px; 
      border: 1.5px solid var(--border-subtle); 
      border-radius: 12px; 
      overflow: hidden;
      background: var(--bg-2);
    }
  </style>
</head>
<body>
  <div class="tool-page">
    <nav class="tool-nav">
      <a class="back-btn" href="../index.html">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
        Back to PALMTOOLS
      </a>
    </nav>

    <header class="tool-header">
      <div class="tool-icon-badge">📄</div>
      <h1 class="tool-title">Rich Text <span class="accent">to PDF</span></h1>
      <p class="tool-subtitle">Write, format, add images, and colorize your text. Preview and export directly as an automatically paginated PDF document.</p>
    </header>

    <div class="card">
      <div class="card-title">Document Content</div>

      <div class="field">
        <label class="label">Document Title (Saved as Filename)</label>
        <input class="input" type="text" id="docTitle" placeholder="My Awesome Document" />
      </div>

      <div class="field">
        <label class="label">Body Text & Images</label>
        <div class="editor-wrapper">
          <div id="editor-container"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">PDF Layout Settings</div>
      <div class="options-grid">
        <div class="field">
          <label class="label">Page Size</label>
          <select class="input" id="pageSize">
            <option value="a4" selected>A4</option>
            <option value="letter">Letter</option>
            <option value="a3">A3</option>
            <option value="legal">Legal</option>
          </select>
        </div>
        <div class="field">
          <label class="label">Orientation</label>
          <select class="input" id="orientation">
            <option value="portrait" selected>Portrait</option>
            <option value="landscape">Landscape</option>
          </select>
        </div>
        <div class="field">
          <label class="label">Margin</label>
          <select class="input" id="margin">
            <option value="10">Narrow</option>
            <option value="20" selected>Normal</option>
            <option value="30">Wide</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Document Preview</div>
      <div class="actions">
        <button class="btn btn-secondary" id="previewBtn" onclick="processPDF('preview')">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          Generate Preview
        </button>
      </div>
      
      <div id="previewWrapper" class="preview-iframe-wrapper" style="display: none;">
        <iframe id="pdfIframe" style="width: 100%; height: 100%; border: none;"></iframe>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Export</div>
      <div id="convertStatus" style="display:none"></div>
      <div class="actions">
        <button class="btn btn-primary" id="convertBtn" onclick="processPDF('save')">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download PDF
        </button>
        <button class="btn btn-ghost" onclick="clearText()">Clear document</button>
      </div>
    </div>
  </div>

  <script>
    // 1. Initialize Quill Rich Text Editor
    const toolbarOptions = [
      [{ 'size': ['small', false, 'large', 'huge'] }],
      ['bold', 'italic', 'underline', 'strike'], 
      [{ 'color': [] }, { 'background': [] }],   
      [{ 'align': [] }],                         
      [{ 'list': 'ordered'}, { 'list': 'bullet' }],
      ['image', 'link'],                         
      ['clean']                                  
    ];

    const quill = new Quill('#editor-container', {
      modules: { toolbar: toolbarOptions },
      theme: 'snow',
      placeholder: 'Start writing your document... You can highlight text to change its size and color, or click the image icon to insert photos!'
    });

    quill.root.addEventListener('focus', () => document.querySelector('.ql-container').classList.add('focus'));
    quill.root.addEventListener('blur', () => document.querySelector('.ql-container').classList.remove('focus'));

    function clearText() {
      if(confirm("Are you sure you want to clear the entire document?")) {
        quill.setContents([]);
        document.getElementById('docTitle').value = '';
        document.getElementById('previewWrapper').style.display = 'none';
      }
    }

    // 2. Process PDF (Handles both Previewing and Saving)
    function processPDF(action) {
      const contentHTML = quill.root.innerHTML;
      const title = document.getElementById('docTitle').value.trim();
      const statusEl = document.getElementById('convertStatus');
      
      const btn = action === 'preview' ? document.getElementById('previewBtn') : document.getElementById('convertBtn');
      const origBtnHtml = btn.innerHTML;

      if (quill.getText().trim().length === 0 && !contentHTML.includes('<img')) {
        if (action === 'save') {
          statusEl.style.display = 'flex';
          statusEl.className = 'status error fade-in';
          statusEl.innerHTML = '<div class="status-dot"></div>Please enter some text or add an image first.';
        } else {
          alert("Please enter some text or add an image before previewing.");
        }
        return;
      }

      // UI Loading State
      btn.disabled = true;
      btn.innerHTML = `<div class="spinner"></div> ${action === 'preview' ? 'Rendering...' : 'Generating PDF...'}`;
      
      if (action === 'save') {
        statusEl.style.display = 'flex';
        statusEl.className = 'status info fade-in';
        statusEl.innerHTML = '<div class="status-dot"></div>Formatting pages and generating your PDF…';
      }

      // Create a hidden container to accurately render HTML structure for PDF compilation
      const printContainer = document.createElement('div');
      printContainer.className = 'ql-editor'; 
      printContainer.innerHTML = `<style>img { max-width: 100%; height: auto; }</style>` + contentHTML;
      printContainer.style.width = '800px'; 
      printContainer.style.position = 'absolute';
      printContainer.style.left = '-9999px';
      printContainer.style.top = '0';
      document.body.appendChild(printContainer);

      const marginMm = parseInt(document.getElementById('margin').value);
      const filename = (title || 'palmtools_document').toLowerCase().replace(/[^a-z0-9]+/g,'_') + '.pdf';

      const opt = {
        margin:       marginMm,
        filename:     filename,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true, letterRendering: true },
        pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }, 
        jsPDF:        { 
          unit: 'mm', 
          format: document.getElementById('pageSize').value, 
          orientation: document.getElementById('orientation').value 
        }
      };

      // Generate the PDF
      if (action === 'preview') {
        html2pdf().set(opt).from(printContainer).outputPdf('bloburl').then((pdfUrl) => {
          document.body.removeChild(printContainer);
          document.getElementById('previewWrapper').style.display = 'block';
          document.getElementById('pdfIframe').src = pdfUrl;
          btn.disabled = false;
          btn.innerHTML = origBtnHtml;
        }).catch(err => {
          document.body.removeChild(printContainer);
          btn.disabled = false;
          btn.innerHTML = origBtnHtml;
          alert("Preview error: " + err.message);
        });
      } else {
        html2pdf().set(opt).from(printContainer).save().then(() => {
          document.body.removeChild(printContainer); 
          statusEl.className = 'status success fade-in';
          statusEl.innerHTML = '<div class="status-dot"></div>PDF downloaded successfully!';
          btn.disabled = false;
          btn.innerHTML = origBtnHtml;
        }).catch(err => {
          document.body.removeChild(printContainer);
          statusEl.className = 'status error fade-in';
          statusEl.innerHTML = `<div class="status-dot"></div>Error: ${err.message}`;
          btn.disabled = false;
          btn.innerHTML = origBtnHtml;
        });
      }
    }
  </script>
</body>
</html>
