<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Text to PDF — PALMTOOLS</title>
  <link rel="stylesheet" href="../shared.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    .toolbar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .fmt-btn {
      padding: 7px 12px;
      border-radius: 8px;
      border: 1.5px solid var(--border-subtle);
      background: var(--surface-2);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.15s;
    }
    .fmt-btn:hover, .fmt-btn.active {
      border-color: var(--orange);
      color: var(--orange);
      background: var(--orange-glow);
    }
    #textEditor {
      width: 100%;
      min-height: 280px;
      padding: 18px;
      background: var(--bg-2);
      border: 1.5px solid var(--border-subtle);
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: var(--text);
      outline: none;
      resize: vertical;
      line-height: 1.75;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #textEditor:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px var(--orange-glow);
    }
    .char-count {
      font-size: 12px;
      color: var(--text-faint);
      text-align: right;
      margin-top: 6px;
    }
    .preview-box {
      background: white;
      color: #1C1917;
      border-radius: 12px;
      padding: 28px 32px;
      border: 1.5px solid var(--border-subtle);
      min-height: 200px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      max-height: 340px;
      overflow-y: auto;
    }
    .preview-header {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-faint);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
    }
    .page-preview-thumb {
      display: inline-block;
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 4px;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
      width: 24px; height: 34px;
      vertical-align: middle;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div class="tool-page">
    <nav class="tool-nav">
      <a class="back-btn" href="../index.html">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
        Back to PALMTOOLS
      </a>
    </nav>

    <header class="tool-header">
      <div class="tool-icon-badge">📄</div>
      <h1 class="tool-title">Text <span class="accent">to PDF</span></h1>
      <p class="tool-subtitle">Type or paste your content and export as a clean, formatted PDF. Customize fonts, size, and layout.</p>
    </header>

    <!-- Editor -->
    <div class="card">
      <div class="card-title">Content</div>

      <!-- Optional title field -->
      <div class="field">
        <label class="label">Document Title (optional)</label>
        <input class="input" type="text" id="docTitle" placeholder="My Document" oninput="updatePreview()" />
      </div>

      <div class="field">
        <label class="label">Body Text</label>
        <textarea id="textEditor" placeholder="Start typing your content here…&#10;&#10;You can paste text from anywhere. Paragraphs, lists, notes — anything you need to turn into a PDF." oninput="updateCharCount(); updatePreview()"></textarea>
        <div class="char-count"><span id="charCount">0</span> characters · <span id="lineCount">0</span> lines</div>
      </div>
    </div>

    <!-- PDF Options -->
    <div class="card">
      <div class="card-title">PDF Settings</div>
      <div class="options-grid">
        <div class="field">
          <label class="label">Page Size</label>
          <select class="input" id="pageSize" onchange="updatePreview()">
            <option value="a4">A4</option>
            <option value="letter">Letter</option>
            <option value="a5">A5</option>
            <option value="a3">A3</option>
          </select>
        </div>
        <div class="field">
          <label class="label">Orientation</label>
          <select class="input" id="orientation" onchange="updatePreview()">
            <option value="portrait">Portrait</option>
            <option value="landscape">Landscape</option>
          </select>
        </div>
        <div class="field">
          <label class="label">Font Size</label>
          <select class="input" id="fontSize" onchange="updatePreview()">
            <option value="10">Small (10pt)</option>
            <option value="12" selected>Normal (12pt)</option>
            <option value="14">Large (14pt)</option>
            <option value="16">Extra Large (16pt)</option>
          </select>
        </div>
        <div class="field">
          <label class="label">Margin</label>
          <select class="input" id="margin" onchange="updatePreview()">
            <option value="15">Narrow (15mm)</option>
            <option value="20" selected>Normal (20mm)</option>
            <option value="30">Wide (30mm)</option>
          </select>
        </div>
        <div class="field">
          <label class="label">Font</label>
          <select class="input" id="fontChoice" onchange="updatePreview()">
            <option value="helvetica">Helvetica (Sans)</option>
            <option value="times">Times (Serif)</option>
            <option value="courier">Courier (Mono)</option>
          </select>
        </div>
        <div class="field">
          <label class="label">Line Spacing</label>
          <select class="input" id="lineSpacing" onchange="updatePreview()">
            <option value="1">Single</option>
            <option value="1.5" selected>1.5×</option>
            <option value="2">Double</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Preview -->
    <div class="card">
      <div class="card-title">Preview</div>
      <div class="preview-header">
        <span>Page preview</span>
        <span id="pageCountLabel" style="color:var(--text-faint)">—</span>
      </div>
      <div class="preview-box" id="previewBox">
        <em style="color:#aaa">Your content will appear here…</em>
      </div>
    </div>

    <!-- Convert -->
    <div class="card">
      <div class="card-title">Export</div>
      <div id="convertStatus" style="display:none"></div>
      <div class="actions">
        <button class="btn btn-primary" id="convertBtn" onclick="generatePDF()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download PDF
        </button>
        <button class="btn btn-ghost" onclick="clearText()">Clear text</button>
      </div>
    </div>
  </div>

  <script>
    function updateCharCount() {
      const text = document.getElementById('textEditor').value;
      document.getElementById('charCount').textContent = text.length.toLocaleString();
      document.getElementById('lineCount').textContent = text.split('\n').length.toLocaleString();
    }

    function updatePreview() {
      const title = document.getElementById('docTitle').value.trim();
      const text = document.getElementById('textEditor').value;
      const box = document.getElementById('previewBox');
      const fontFamilies = { helvetica: 'Arial, sans-serif', times: 'Georgia, serif', courier: 'Courier New, monospace' };
      const font = fontFamilies[document.getElementById('fontChoice').value] || 'Arial, sans-serif';
      const fontSize = document.getElementById('fontSize').value;
      const lineSpacing = document.getElementById('lineSpacing').value;

      if (!text.trim() && !title) {
        box.innerHTML = '<em style="color:#aaa">Your content will appear here…</em>';
        document.getElementById('pageCountLabel').textContent = '—';
        return;
      }

      let html = '';
      if (title) {
        html += `<div style="font-size:${parseInt(fontSize)+4}px;font-weight:700;margin-bottom:12px;font-family:${font}">${escHtml(title)}</div>`;
        html += `<hr style="border:none;border-top:1px solid #ddd;margin-bottom:14px"/>`;
      }
      html += `<div style="font-family:${font};font-size:${fontSize}px;line-height:${lineSpacing}">${escHtml(text).replace(/\n/g, '<br/>')}</div>`;
      box.innerHTML = html;

      // Rough page count estimate
      const fontSize_n = parseInt(fontSize);
      const lineH = fontSize_n * 1.2 * parseFloat(lineSpacing);
      const margin = parseInt(document.getElementById('margin').value);
      const pageSize = document.getElementById('pageSize').value;
      const orient = document.getElementById('orientation').value;
      const pageDims = { a4:[210,297], letter:[215.9,279.4], a5:[148,210], a3:[297,420] };
      let [pw,ph] = pageDims[pageSize] || pageDims.a4;
      if (orient === 'landscape') [pw,ph] = [ph,pw];
      const availH_mm = ph - margin * 2;
      const availH_pt = availH_mm * 2.8346;
      const linesPerPage = Math.floor(availH_pt / lineH);
      const totalLines = text.split('\n').reduce((sum, line) => {
        const availW_mm = pw - margin * 2;
        const charsPerLine = Math.max(1, Math.floor(availW_mm * 2.8346 / (fontSize_n * 0.6)));
        return sum + Math.max(1, Math.ceil(line.length / charsPerLine));
      }, 0);
      const pages = Math.max(1, Math.ceil(totalLines / linesPerPage));
      document.getElementById('pageCountLabel').textContent = `~${pages} page${pages !== 1 ? 's' : ''}`;
    }

    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function clearText() {
      document.getElementById('textEditor').value = '';
      document.getElementById('docTitle').value = '';
      updateCharCount();
      updatePreview();
    }

    function generatePDF() {
      const text = document.getElementById('textEditor').value.trim();
      const title = document.getElementById('docTitle').value.trim();

      if (!text && !title) {
        const statusEl = document.getElementById('convertStatus');
        statusEl.style.display = 'flex';
        statusEl.className = 'status error fade-in';
        statusEl.innerHTML = '<div class="status-dot"></div>Please enter some text first.';
        return;
      }

      const btn = document.getElementById('convertBtn');
      const statusEl = document.getElementById('convertStatus');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Generating…';
      statusEl.style.display = 'flex';
      statusEl.className = 'status info fade-in';
      statusEl.innerHTML = '<div class="status-dot"></div>Creating your PDF…';

      try {
        const { jsPDF } = window.jspdf;

        const pageSizeVal = document.getElementById('pageSize').value;
        const orient = document.getElementById('orientation').value;
        const fontSizePt = parseInt(document.getElementById('fontSize').value);
        const marginMm = parseInt(document.getElementById('margin').value);
        const fontChoice = document.getElementById('fontChoice').value;
        const lineSpacing = parseFloat(document.getElementById('lineSpacing').value);

        const pageSizes = { a4:[210,297], letter:[215.9,279.4], a5:[148,210], a3:[297,420] };
        let [pw,ph] = pageSizes[pageSizeVal] || pageSizes.a4;
        if (orient === 'landscape') [pw,ph] = [ph,pw];

        const pdf = new jsPDF({ unit: 'mm', format: [pw, ph], orientation: orient });
        pdf.setFont(fontChoice, 'normal');
        pdf.setFontSize(fontSizePt);

        const availW = pw - marginMm * 2;
        const lineH = fontSizePt * 0.3528 * lineSpacing; // pt to mm
        let y = marginMm;

        // Title
        if (title) {
          pdf.setFont(fontChoice, 'bold');
          pdf.setFontSize(fontSizePt + 6);
          const titleLines = pdf.splitTextToSize(title, availW);
          pdf.text(titleLines, marginMm, y + (fontSizePt + 6) * 0.3528);
          y += titleLines.length * (fontSizePt + 6) * 0.3528 * lineSpacing + 4;
          pdf.setLineWidth(0.4);
          pdf.setDrawColor(200,200,200);
          pdf.line(marginMm, y, pw - marginMm, y);
          y += 5;
          pdf.setFont(fontChoice, 'normal');
          pdf.setFontSize(fontSizePt);
        }

        // Body text
        const paragraphs = text.split('\n');
        for (const para of paragraphs) {
          const lines = pdf.splitTextToSize(para || ' ', availW);
          for (const line of lines) {
            if (y + lineH > ph - marginMm) {
              pdf.addPage([pw, ph], orient);
              y = marginMm;
            }
            pdf.text(line, marginMm, y + fontSizePt * 0.3528);
            y += lineH;
          }
        }

        // Footer on each page
        const totalPages = pdf.internal.getNumberOfPages();
        for (let i = 1; i <= totalPages; i++) {
          pdf.setPage(i);
          pdf.setFontSize(9);
          pdf.setTextColor(160,160,160);
          pdf.text(`Page ${i} of ${totalPages}`, pw / 2, ph - 8, { align: 'center' });
          pdf.text('Created with PALMTOOLS', marginMm, ph - 8);
          pdf.setTextColor(0,0,0);
          pdf.setFontSize(fontSizePt);
        }

        const filename = (title || 'document').toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,40);
        pdf.save(`palmtools_${filename}.pdf`);

        statusEl.className = 'status success fade-in';
        statusEl.innerHTML = '<div class="status-dot"></div>PDF downloaded successfully!';

      } catch(err) {
        console.error(err);
        statusEl.className = 'status error fade-in';
        statusEl.innerHTML = `<div class="status-dot"></div>Error: ${err.message}`;
      }

      btn.disabled = false;
      btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download PDF`;
    }
  </script>
</body>
</html>
