<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Text to PDF — PALMTOOLS</title>
  <link rel="stylesheet" href="../shared.css"/>
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    /* ── THEME SELECTOR ── */
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }
    @media (max-width: 580px) { .theme-grid { grid-template-columns: repeat(3, 1fr); } }

    .theme-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 14px 10px 12px;
      border-radius: 16px;
      border: 2px solid var(--border-subtle);
      background: var(--bg-2);
      cursor: pointer;
      transition: all 0.22s ease;
    }
    .theme-card:hover { border-color: var(--orange); transform: translateY(-2px); box-shadow: var(--shadow-hover); }
    .theme-card.active { border-color: var(--orange); background: var(--orange-glow); box-shadow: 0 0 0 3px var(--orange-glow); }
    .theme-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; font-family: 'DM Sans', sans-serif; }
    .theme-card.active .theme-label { color: var(--orange); }

    .theme-preview {
      width: 100%;
      aspect-ratio: 0.707;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 7px 6px;
      gap: 3px;
    }
    .tp-line { height: 3px; border-radius: 2px; background: #d1d5db; flex-shrink: 0; }
    .tp-line.h { height: 5px; background: #9ca3af; width: 70%; }
    .tp-line.s { width: 55%; }
    .tp-line.xs { width: 40%; }

    .tp-minimal { background: #fff; border: 1px solid #e5e7eb; }
    .tp-minimal .tp-line.h { background: #111; }

    .tp-corporate { background: #fff; border: 1px solid #e5e7eb; }
    .tp-corp-bar { height: 12px; background: #1e3a5f; border-radius: 3px 3px 0 0; margin: -7px -6px 5px; flex-shrink: 0; }
    .tp-corporate .tp-line.h { background: #1e3a5f; }

    .tp-creative { background: #fff; border: 1px solid #e5e7eb; }
    .tp-accent-bar { height: 4px; width: 32px; background: linear-gradient(90deg,#F97316,#F59E0B); border-radius: 2px; margin-bottom: 2px; flex-shrink: 0; }
    .tp-creative .tp-line.h { background: #F97316; width: 80%; }

    .tp-academic { background: #fffef9; border: 1px solid #e5e7eb; }
    .tp-acad-title { height: 5px; width: 75%; background: #444; border-radius: 1px; align-self: center; margin-bottom: 3px; flex-shrink: 0; }
    .tp-acad-rule { height: 1px; background: #bbb; margin: 2px 0 3px; flex-shrink: 0; }
    .tp-academic .tp-line { background: #999; }

    .tp-dark { background: #0d1b2a; border: 1px solid #1e3a5f; }
    .tp-dark .tp-line { background: rgba(255,255,255,0.13); }
    .tp-dark .tp-line.h { background: rgba(249,115,22,0.7); }

    /* ── TOGGLE SWITCH ── */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }
    .toggle-info strong { display: block; font-size: 15px; font-weight: 600; color: var(--text); }
    .toggle-info span { font-size: 13px; color: var(--text-muted); }
    .tog { position: relative; width: 48px; height: 28px; flex-shrink: 0; }
    .tog input { opacity: 0; width: 0; height: 0; position: absolute; }
    .tog-track {
      position: absolute; inset: 0;
      background: var(--border-subtle);
      border-radius: 14px;
      transition: background 0.22s;
      cursor: pointer;
    }
    .tog-track::after {
      content: '';
      position: absolute; left: 3px; top: 3px;
      width: 22px; height: 22px;
      background: white; border-radius: 50%;
      transition: transform 0.22s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    }
    .tog input:checked + .tog-track { background: var(--orange); }
    .tog input:checked + .tog-track::after { transform: translateX(20px); }

    /* ── COLLAPSIBLE ── */
    .collapsible { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-subtle); }
    .collapsible.open { display: block; }

    /* ── GRIDS ── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 480px) { .grid-2 { grid-template-columns: 1fr; } }

    /* ── SEGMENT BUTTONS ── */
    .seg-group { display: flex; gap: 6px; }
    .seg-btn {
      flex: 1; padding: 10px 6px;
      border-radius: 10px;
      border: 1.5px solid var(--border-subtle);
      background: var(--bg-2);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px; font-family: 'DM Sans', sans-serif; font-weight: 700;
      text-align: center; text-transform: uppercase; letter-spacing: 0.05em;
      transition: all 0.18s;
    }
    .seg-btn:hover { border-color: var(--orange); color: var(--orange); }
    .seg-btn.active { border-color: var(--orange); background: var(--orange-glow); color: var(--orange); }

    /* ── PAGE NUMBER FORMAT ── */
    .pn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .pn-opt {
      padding: 10px 12px; border-radius: 10px;
      border: 1.5px solid var(--border-subtle);
      background: var(--bg-2); color: var(--text-muted);
      cursor: pointer; font-size: 13px; font-family: 'DM Sans', sans-serif; font-weight: 600;
      text-align: center; transition: all 0.18s;
    }
    .pn-opt:hover { border-color: var(--orange); color: var(--orange); }
    .pn-opt.active { border-color: var(--orange); background: var(--orange-glow); color: var(--orange); }

    /* ── QUILL ── */
    .editor-wrapper { border-radius: 12px; overflow: hidden; margin-top: 8px; }
    .ql-toolbar.ql-snow {
      border: 1.5px solid var(--border-subtle); border-bottom: none;
      border-radius: 12px 12px 0 0;
      background: var(--surface-2); font-family: 'DM Sans', sans-serif; padding: 10px;
    }
    .ql-container.ql-snow {
      border: 1.5px solid var(--border-subtle);
      border-radius: 0 0 12px 12px;
      background: var(--bg-2); font-family: 'DM Sans', sans-serif;
      font-size: 15px; color: var(--text); min-height: 380px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .ql-container.ql-snow.focused { border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-glow); }
    .ql-editor { min-height: 380px; line-height: 1.75; padding: 24px; }
    .ql-editor img { max-width: 100%; height: auto; border-radius: 8px; margin: 8px 0; }
    .ql-editor blockquote { border-left: 3px solid var(--orange); padding-left: 16px; color: var(--text-muted); }

    .ql-snow.ql-toolbar button:hover, .ql-snow .ql-toolbar button.ql-active,
    .ql-snow.ql-toolbar .ql-picker-label:hover, .ql-snow .ql-toolbar .ql-picker-label.ql-active,
    .ql-snow.ql-toolbar .ql-picker-item:hover, .ql-snow .ql-toolbar .ql-picker-item.ql-selected { color: var(--orange); }
    .ql-snow.ql-toolbar button:hover .ql-stroke, .ql-snow .ql-toolbar button.ql-active .ql-stroke,
    .ql-snow.ql-toolbar .ql-picker-label:hover .ql-stroke { stroke: var(--orange); }
    .ql-snow.ql-toolbar button:hover .ql-fill, .ql-snow .ql-toolbar button.ql-active .ql-fill { fill: var(--orange); }

    /* ── PREVIEW ── */
    .preview-frame {
      margin-top: 18px;
      border: 1.5px dashed var(--border-subtle); border-radius: 12px;
      background: var(--bg-2);
    }

    .section-rule { border: none; border-top: 1px solid var(--border-subtle); margin: 18px 0; }
  </style>
</head>

<body>
  <div class="tool-page">

    <nav class="tool-nav">
      <a class="back-btn" href="../index.html">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
        Back to PALMTOOLS
      </a>
    </nav>

    <header class="tool-header">
      <div class="tool-icon-badge">📄</div>
      <h1 class="tool-title">Text <span class="accent">to PDF</span></h1>
      <p class="tool-subtitle">Write rich documents with formatting, images, headers, footers, cover pages, and page numbers — then export as a perfectly paginated PDF in any style.</p>
    </header>

    <div class="card">
      <div class="card-title">Template</div>
      <div class="theme-grid">

        <button class="theme-card active" data-theme="minimal" onclick="selectTheme(this)">
          <div class="theme-preview tp-minimal">
            <div class="tp-line h"></div>
            <div class="tp-line"></div>
            <div class="tp-line s"></div>
            <div class="tp-line"></div>
            <div class="tp-line xs"></div>
            <div class="tp-line"></div>
          </div>
          <span class="theme-label">Minimal</span>
        </button>

        <button class="theme-card" data-theme="corporate" onclick="selectTheme(this)">
          <div class="theme-preview tp-corporate">
            <div class="tp-corp-bar"></div>
            <div class="tp-line h"></div>
            <div class="tp-line"></div>
            <div class="tp-line s"></div>
            <div class="tp-line"></div>
            <div class="tp-line xs"></div>
          </div>
          <span class="theme-label">Corporate</span>
        </button>

        <button class="theme-card" data-theme="creative" onclick="selectTheme(this)">
          <div class="theme-preview tp-creative">
            <div class="tp-accent-bar"></div>
            <div class="tp-line h"></div>
            <div class="tp-line"></div>
            <div class="tp-line s"></div>
            <div class="tp-line"></div>
            <div class="tp-line xs"></div>
          </div>
          <span class="theme-label">Creative</span>
        </button>

        <button class="theme-card" data-theme="academic" onclick="selectTheme(this)">
          <div class="theme-preview tp-academic">
            <div class="tp-acad-title"></div>
            <div class="tp-acad-rule"></div>
            <div class="tp-line s"></div>
            <div class="tp-line"></div>
            <div class="tp-line xs"></div>
            <div class="tp-line"></div>
          </div>
          <span class="theme-label">Academic</span>
        </button>

        <button class="theme-card" data-theme="dark" onclick="selectTheme(this)">
          <div class="theme-preview tp-dark">
            <div class="tp-line h"></div>
            <div class="tp-line"></div>
            <div class="tp-line s"></div>
            <div class="tp-line"></div>
            <div class="tp-line xs"></div>
            <div class="tp-line"></div>
          </div>
          <span class="theme-label">Dark</span>
        </button>

      </div>
    </div>

    <div class="card">
      <label class="toggle-row" for="coverToggle">
        <div class="toggle-info">
          <strong>Cover Page</strong>
          <span>Add a styled title page before your content</span>
        </div>
        <div class="tog">
          <input type="checkbox" id="coverToggle" onchange="document.getElementById('coverFields').classList.toggle('open',this.checked)">
          <div class="tog-track"></div>
        </div>
      </label>
      <div class="collapsible" id="coverFields">
        <div class="grid-2">
          <div class="field">
            <label class="label">Document Title</label>
            <input class="input" type="text" id="coverTitle" placeholder="My Document Title"/>
          </div>
          <div class="field">
            <label class="label">Subtitle</label>
            <input class="input" type="text" id="coverSubtitle" placeholder="Optional tagline or subtitle"/>
          </div>
          <div class="field">
            <label class="label">Author</label>
            <input class="input" type="text" id="coverAuthor" placeholder="Your name or organization"/>
          </div>
          <div class="field">
            <label class="label">Date</label>
            <input class="input" type="text" id="coverDate" placeholder="e.g. March 2026"/>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Document Content</div>
      <div class="field">
        <label class="label">Filename (saved as filename.pdf)</label>
        <input class="input" type="text" id="docFilename" placeholder="my_document"/>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label class="label">Body</label>
        <div class="editor-wrapper">
          <div id="editor-container"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Page Settings</div>
      <div class="grid-2">
        <div class="field">
          <label class="label">Page Size</label>
          <select class="input" id="pageSize">
            <option value="a4" selected>A4 (210 × 297mm)</option>
            <option value="letter">Letter (216 × 279mm)</option>
            <option value="a3">A3 (297 × 420mm)</option>
            <option value="legal">Legal (216 × 356mm)</option>
          </select>
        </div>
        <div class="field">
          <label class="label">Orientation</label>
          <select class="input" id="orientation">
            <option value="portrait" selected>Portrait</option>
            <option value="landscape">Landscape</option>
          </select>
        </div>
        <div class="field">
          <label class="label">Margin</label>
          <select class="input" id="margin">
            <option value="8">Narrow (8mm)</option>
            <option value="15">Compact (15mm)</option>
            <option value="20" selected>Normal (20mm)</option>
            <option value="28">Wide (28mm)</option>
            <option value="36">Extra Wide (36mm)</option>
          </select>
        </div>
        <div class="field">
          <label class="label">Font Family</label>
          <select class="input" id="fontFamily">
            <option value="'DM Sans',Helvetica,sans-serif" selected>DM Sans (Default)</option>
            <option value="Georgia,'Times New Roman',serif">Georgia (Serif)</option>
            <option value="'Times New Roman',Times,serif">Times New Roman</option>
            <option value="'Courier New',Courier,monospace">Courier New (Mono)</option>
            <option value="Arial,Helvetica,sans-serif">Arial</option>
            <option value="Verdana,Geneva,sans-serif">Verdana</option>
          </select>
        </div>
        <div class="field">
          <label class="label">Body Font Size</label>
          <select class="input" id="bodyFontSize">
            <option value="11px">Small (11px)</option>
            <option value="13px">Normal (13px)</option>
            <option value="15px" selected>Medium (15px)</option>
            <option value="17px">Large (17px)</option>
            <option value="19px">Extra Large (19px)</option>
          </select>
        </div>
        <div class="field">
          <label class="label">Line Spacing</label>
          <select class="input" id="lineSpacing">
            <option value="1.4">Compact (1.4)</option>
            <option value="1.6">Normal (1.6)</option>
            <option value="1.75" selected>Relaxed (1.75)</option>
            <option value="2.0">Double (2.0)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Header & Footer</div>

      <div class="field">
        <label class="label">Header Text</label>
        <input class="input" type="text" id="headerText" placeholder="e.g. Company Name — Confidential"/>
      </div>
      <div class="field">
        <label class="label">Header Alignment</label>
        <div class="seg-group" id="headerAlignBtns">
          <button class="seg-btn active" onclick="setSegGroup('headerAlignBtns',this); headerAlign='left';">Left</button>
          <button class="seg-btn"        onclick="setSegGroup('headerAlignBtns',this); headerAlign='center';">Center</button>
          <button class="seg-btn"        onclick="setSegGroup('headerAlignBtns',this); headerAlign='right';">Right</button>
        </div>
      </div>

      <hr class="section-rule">

      <div class="field">
        <label class="label">Footer Text</label>
        <input class="input" type="text" id="footerText" placeholder="e.g. © 2026 PALMTOOLS"/>
      </div>

      <hr class="section-rule">

      <label class="toggle-row" for="pageNumToggle" style="margin-bottom:14px;">
        <div class="toggle-info">
          <strong>Page Numbers</strong>
          <span>Automatically number each page</span>
        </div>
        <div class="tog">
          <input type="checkbox" id="pageNumToggle" checked onchange="document.getElementById('pnOptions').classList.toggle('open',this.checked)">
          <div class="tog-track"></div>
        </div>
      </label>

      <div class="collapsible open" id="pnOptions">
        <div class="field">
          <label class="label">Format</label>
          <div class="pn-grid">
            <button class="pn-opt active" data-fmt="Page {n} of {t}" onclick="setPNFmt(this)">Page 1 of 5</button>
            <button class="pn-opt"        data-fmt="Page {n}"        onclick="setPNFmt(this)">Page 1</button>
            <button class="pn-opt"        data-fmt="{n} / {t}"       onclick="setPNFmt(this)">1 / 5</button>
            <button class="pn-opt"        data-fmt="{n}"             onclick="setPNFmt(this)">1</button>
          </div>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label class="label">Position</label>
          <div class="seg-group" id="pnPosBtns">
            <button class="seg-btn"        onclick="setSegGroup('pnPosBtns',this); pnPos='left';">Left</button>
            <button class="seg-btn active" onclick="setSegGroup('pnPosBtns',this); pnPos='center';">Center</button>
            <button class="seg-btn"        onclick="setSegGroup('pnPosBtns',this); pnPos='right';">Right</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Document Preview</div>
      <div class="actions">
        <button class="btn btn-secondary" id="previewBtn" onclick="runPDF('preview')">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          Generate Preview
        </button>
      </div>
      <div id="previewWrapper" style="display:none;">
        </div>
    </div>

    <div class="card">
      <div class="card-title">Export</div>
      <div id="exportStatus" style="display:none;"></div>
      <div class="actions">
        <button class="btn btn-primary" id="exportBtn" onclick="runPDF('save')">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download PDF
        </button>
        <button class="btn btn-ghost" onclick="clearAll()">Clear All</button>
      </div>
    </div>

  </div>

  <script>
  // ── STATE
  let currentTheme = 'minimal';
  let headerAlign  = 'left';
  let pnFormat     = 'Page {n} of {t}';
  let pnPos        = 'center';

  // ── THEMES
  const THEMES = {
    minimal: {
      pageBg: '#ffffff', textColor: '#111111', headColor: '#111111', bodyExtra: '',
      cover: d => `
        <div style="height:1122px;display:flex;flex-direction:column;justify-content:center;align-items:center;
                    text-align:center;padding:80px;background:#ffffff;page-break-after:always;">
          <div style="width:48px;height:3px;background:#111;border-radius:2px;margin-bottom:48px;"></div>
          <h1 style="font-size:54px;font-weight:700;color:#111;line-height:1.05;margin-bottom:18px;">${d.title}</h1>
          ${d.subtitle ? `<p style="font-size:20px;color:#666;margin-bottom:48px;">${d.subtitle}</p>` : '<div style="height:48px;"></div>'}
          <div style="width:48px;height:3px;background:#111;border-radius:2px;margin-bottom:48px;"></div>
          ${d.author ? `<p style="font-size:16px;font-weight:600;color:#333;">${d.author}</p>` : ''}
          ${d.date   ? `<p style="font-size:13px;color:#999;margin-top:8px;">${d.date}</p>` : ''}
        </div>`
    },
    corporate: {
      pageBg: '#ffffff', textColor: '#2d3748', headColor: '#1e3a5f', bodyExtra: '',
      cover: d => `
        <div style="height:1122px;display:flex;flex-direction:column;background:#1e3a5f;page-break-after:always;overflow:hidden;">
          <div style="height:6px;background:linear-gradient(90deg,#F97316,#F59E0B);flex-shrink:0;"></div>
          <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:80px;">
            <p style="font-size:11px;font-weight:700;color:rgba(255,255,255,0.4);letter-spacing:0.2em;text-transform:uppercase;margin-bottom:32px;">Document</p>
            <h1 style="font-size:58px;font-weight:700;color:#fff;line-height:1.0;margin-bottom:22px;">${d.title}</h1>
            ${d.subtitle ? `<p style="font-size:20px;color:rgba(255,255,255,0.6);border-left:4px solid #F97316;padding-left:20px;">${d.subtitle}</p>` : ''}
          </div>
          <div style="padding:44px 80px;border-top:1px solid rgba(255,255,255,0.1);display:flex;justify-content:space-between;align-items:flex-end;">
            ${d.author ? `<p style="font-size:15px;font-weight:600;color:#fff;">${d.author}</p>` : '<span></span>'}
            ${d.date   ? `<p style="font-size:13px;color:rgba(255,255,255,0.45);">${d.date}</p>` : ''}
          </div>
        </div>`
    },
    creative: {
      pageBg: '#ffffff', textColor: '#1a1a1a', headColor: '#F97316', bodyExtra: '',
      cover: d => `
        <div style="height:1122px;display:flex;flex-direction:column;background:#fff;position:relative;overflow:hidden;page-break-after:always;">
          <div style="position:absolute;top:0;right:0;width:360px;height:360px;background:linear-gradient(135deg,#F97316,#F59E0B);border-radius:0 0 0 100%;opacity:0.12;"></div>
          <div style="position:absolute;bottom:0;left:0;width:280px;height:280px;background:linear-gradient(135deg,#F97316,#F59E0B);border-radius:0 100% 0 0;opacity:0.08;"></div>
          <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:90px;position:relative;">
            <div style="height:5px;width:72px;background:linear-gradient(90deg,#F97316,#F59E0B);border-radius:3px;margin-bottom:40px;"></div>
            <h1 style="font-size:62px;font-weight:800;color:#1a1a1a;line-height:0.97;margin-bottom:22px;">${d.title}</h1>
            ${d.subtitle ? `<p style="font-size:22px;color:#F97316;font-weight:500;">${d.subtitle}</p>` : ''}
          </div>
          <div style="padding:44px 90px;display:flex;justify-content:space-between;align-items:center;position:relative;">
            ${d.author ? `<p style="font-size:15px;font-weight:700;color:#1a1a1a;">${d.author}</p>` : '<span></span>'}
            ${d.date   ? `<p style="font-size:13px;color:#aaa;">${d.date}</p>` : ''}
          </div>
        </div>`
    },
    academic: {
      pageBg: '#fffef9', textColor: '#1a1a1a', headColor: '#1a1a1a',
      bodyExtra: "font-family:'Times New Roman',Georgia,serif;",
      cover: d => `
        <div style="height:1122px;display:flex;flex-direction:column;justify-content:space-between;
                    background:#fffef9;padding:100px 80px;page-break-after:always;">
          <div style="text-align:center;padding-bottom:24px;border-bottom:2px solid #333;">
            <p style="font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#666;font-family:'Times New Roman',serif;">${d.date || ''}</p>
          </div>
          <div style="text-align:center;padding:60px 0;">
            <h1 style="font-size:42px;font-weight:700;color:#111;font-family:'Times New Roman',serif;line-height:1.25;margin-bottom:28px;">${d.title}</h1>
            ${d.subtitle ? `<p style="font-size:18px;color:#555;font-style:italic;font-family:'Times New Roman',serif;">${d.subtitle}</p>` : ''}
          </div>
          <div style="text-align:center;padding-top:24px;border-top:1px solid #555;">
            ${d.author ? `<p style="font-size:16px;font-weight:600;color:#333;font-family:'Times New Roman',serif;">${d.author}</p>` : ''}
          </div>
        </div>`
    },
    dark: {
      pageBg: '#16213e', textColor: '#d8e2f0', headColor: '#F97316', bodyExtra: '',
      cover: d => `
        <div style="height:1122px;display:flex;flex-direction:column;justify-content:center;
                    background:#0d1b2a;padding:80px;position:relative;overflow:hidden;page-break-after:always;">
          <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 25% 55%,rgba(249,115,22,0.08),transparent 65%);"></div>
          <div style="position:relative;">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:52px;">
              <div style="width:40px;height:3px;background:linear-gradient(90deg,#F97316,#F59E0B);border-radius:2px;"></div>
              <div style="width:14px;height:3px;background:rgba(249,115,22,0.28);border-radius:2px;"></div>
            </div>
            <h1 style="font-size:58px;font-weight:700;color:#fff;line-height:1.02;margin-bottom:20px;">${d.title}</h1>
            ${d.subtitle ? `<p style="font-size:20px;color:rgba(255,255,255,0.5);margin-bottom:56px;">${d.subtitle}</p>` : '<div style="height:56px;"></div>'}
            <div style="display:flex;gap:28px;align-items:center;">
              ${d.author ? `<p style="font-size:15px;font-weight:600;color:rgba(255,255,255,0.7);">${d.author}</p>` : ''}
              ${d.date   ? `<p style="font-size:13px;color:rgba(255,255,255,0.3);">${d.date}</p>` : ''}
            </div>
          </div>
        </div>`
    }
  };

  // ── QUILL INIT
  const icons = Quill.import('ui/icons');
  icons['undo'] = '<svg viewBox="0 0 18 18"><polygon class="ql-fill ql-stroke" points="6 10 4 12 2 10 6 10"></polygon><path class="ql-stroke" d="M8.09,13.91A4.6,4.6,0,0,0,9,14,5,5,0,1,0,4,9"></path></svg>';
  icons['redo'] = '<svg viewBox="0 0 18 18"><polygon class="ql-fill ql-stroke" points="12 10 14 12 16 10 12 10"></polygon><path class="ql-stroke" d="M9.91,13.91A4.6,4.6,0,0,1,9,14a5,5,0,1,1,5-5"></path></svg>';

  const quill = new Quill('#editor-container', {
    modules: {
      toolbar: {
        container: [
          ['undo','redo'],
          [{ header: [1,2,3,4,false] }],
          ['bold','italic','underline','strike'],
          [{ color:[] }, { background:[] }],
          [{ align:[] }],
          [{ list:'ordered' }, { list:'bullet' }, { indent:'-1' }, { indent:'+1' }],
          ['blockquote','code-block'],
          ['link','image'],
          ['clean']
        ],
        handlers: {
          undo: function(){ this.quill.history.undo(); },
          redo: function(){ this.quill.history.redo(); }
        }
      },
      history: { delay: 1000, maxStack: 100, userOnly: true }
    },
    theme: 'snow',
    placeholder: 'Start writing your document… use the toolbar to add headings, formatting, images, links, and more.'
  });

  quill.root.addEventListener('focus', () => document.querySelector('.ql-container').classList.add('focused'));
  quill.root.addEventListener('blur',  () => document.querySelector('.ql-container').classList.remove('focused'));

  // ── UI HELPERS
  function selectTheme(btn) {
    document.querySelectorAll('.theme-card').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    currentTheme = btn.dataset.theme;
  }

  function setSegGroup(groupId, btn) {
    document.querySelectorAll('#' + groupId + ' .seg-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function setPNFmt(btn) {
    document.querySelectorAll('.pn-opt').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    pnFormat = btn.dataset.fmt;
  }

  function clearAll() {
    if (!confirm('Clear everything and start fresh?')) return;
    quill.setContents([]);
    ['docFilename','coverTitle','coverSubtitle','coverAuthor','coverDate','headerText','footerText']
      .forEach(id => document.getElementById(id).value = '');
    document.getElementById('previewWrapper').style.display = 'none';
    document.getElementById('exportStatus').style.display  = 'none';
  }

  // ── PDF ENGINE
  function runPDF(action) {
    const contentHTML = quill.root.innerHTML;
    const hasContent  = quill.getText().trim().length > 0 || contentHTML.includes('<img');
    const statusEl    = document.getElementById('exportStatus');
    const btn         = document.getElementById(action === 'preview' ? 'previewBtn' : 'exportBtn');
    const origHTML    = btn.innerHTML;

    if (!hasContent) {
      if (action === 'save') {
        statusEl.style.display = 'flex';
        statusEl.className = 'status error fade-in';
        statusEl.innerHTML = '<div class="status-dot"></div>Add some content before exporting.';
      } else {
        alert('Please add some content before previewing.');
      }
      return;
    }

    btn.disabled  = true;
    btn.innerHTML = `<div class="spinner"></div>${action === 'preview' ? 'Rendering…' : 'Generating…'}`;
    if (action === 'save') {
      statusEl.style.display = 'flex';
      statusEl.className = 'status info fade-in';
      statusEl.innerHTML  = '<div class="status-dot"></div>Building your PDF…';
    }

    const theme      = THEMES[currentTheme];
    const fontFamily = document.getElementById('fontFamily').value;
    const fontSize   = document.getElementById('bodyFontSize').value;
    const lineHeight = document.getElementById('lineSpacing').value;
    const marginMm   = parseInt(document.getElementById('margin').value);
    const pageSize   = document.getElementById('pageSize').value;
    const orient     = document.getElementById('orientation').value;
    const hdrText    = document.getElementById('headerText').value.trim();
    const ftrText    = document.getElementById('footerText').value.trim();
    const showPN     = document.getElementById('pageNumToggle').checked;
    const hasCover   = document.getElementById('coverToggle').checked;
    const filename   = (document.getElementById('docFilename').value.trim() || 'palmtools_document')
                         .toLowerCase().replace(/[^a-z0-9]+/g,'_') + '.pdf';

    let coverHTML = '';
    if (hasCover) {
      coverHTML = theme.cover({
        title:    document.getElementById('coverTitle').value    || 'Untitled Document',
        subtitle: document.getElementById('coverSubtitle').value,
        author:   document.getElementById('coverAuthor').value,
        date:     document.getElementById('coverDate').value
      });
    }

    // Pass the DOM element completely detached so it doesn't break styling layout
    const container = document.createElement('div');
    container.style.cssText = `width: 794px; background: ${theme.pageBg}; color: ${theme.textColor}; font-family: ${fontFamily}; font-size: ${fontSize}; line-height: ${lineHeight}; ${theme.bodyExtra}`;
    
    // Removed the "min-height: 1000px" which was forcing the page blank
    container.innerHTML = `
      ${coverHTML}
      <div style="padding:${marginMm * 1.5}px;">
        ${contentHTML}
      </div>
    `;

    // Force text colors to fix the Dark Mode bug, but skip user's custom text colors (like your red text!)
    container.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(h => {
      if (!h.style.color) h.style.color = theme.headColor;
    });
    container.querySelectorAll('p, span, div, li, a, blockquote').forEach(el => {
      if (!el.style.color) el.style.color = theme.textColor;
    });
    container.querySelectorAll('img').forEach(img => {
      img.style.maxWidth = '100%';
      img.style.height = 'auto';
    });

    const hasHdr = !!hdrText;
    const hasFtr = ftrText || showPN;

    const opt = {
      margin:      [marginMm + (hasHdr ? 12 : 0), marginMm, marginMm + (hasFtr ? 12 : 0), marginMm],
      filename,
      image:       { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, letterRendering: true, backgroundColor: theme.pageBg, windowWidth: 800 },
      // REMOVED 'avoid-all' -> This is what caused the massive empty space on export
      pagebreak:   { mode: ['css', 'legacy'] },
      jsPDF:       { unit: 'mm', format: pageSize, orientation: orient }
    };

    html2pdf().set(opt).from(container).toPdf().get('pdf').then(pdf => {
      const total = pdf.internal.getNumberOfPages();
      const pgW   = pdf.internal.pageSize.getWidth();
      const pgH   = pdf.internal.pageSize.getHeight();
      const mm    = marginMm;
      const isDark   = currentTheme === 'dark';
      const lineRGB  = isDark ? [55,75,105]    : [210,210,210];
      const txtRGB   = isDark ? [110,135,165]  : [150,150,150];

      for (let i = 1; i <= total; i++) {
        pdf.setPage(i);
        const isCoverPage = hasCover && i === 1;
        if (isCoverPage) continue;

        if (hasHdr) {
          pdf.setFontSize(8.5);
          pdf.setTextColor(...txtRGB);
          const hX = headerAlign === 'center' ? pgW/2 : headerAlign === 'right' ? pgW - mm : mm;
          pdf.text(hdrText, hX, 7, { align: headerAlign });
          pdf.setDrawColor(...lineRGB);
          pdf.setLineWidth(0.28);
          pdf.line(mm, 9.5, pgW - mm, 9.5);
        }

        if (hasFtr) {
          pdf.setDrawColor(...lineRGB);
          pdf.setLineWidth(0.28);
          pdf.line(mm, pgH - 11, pgW - mm, pgH - 11);
          pdf.setFontSize(8.5);
          pdf.setTextColor(...txtRGB);

          if (ftrText) {
            pdf.text(ftrText, mm, pgH - 7.5, { align: 'left' });
          }

          if (showPN) {
            const n = hasCover ? i - 1 : i;
            const t = hasCover ? total - 1 : total;
            const label = pnFormat.replace('{n}', n).replace('{t}', t);
            const pX = pnPos === 'left' ? mm : pnPos === 'right' ? pgW - mm : pgW / 2;
            pdf.text(label, pX, pgH - 7.5, { align: pnPos });
          }
        }
      }

      if (action === 'preview') {
        const blobUrl = pdf.output('bloburl');
        const previewWrapper = document.getElementById('previewWrapper');
        
        previewWrapper.innerHTML = `
          <div class="preview-frame" style="padding: 40px 20px; text-align: center;">
            <p style="color: var(--text-muted); margin-bottom: 16px;">Click below to view your generated document.</p>
            <a href="${blobUrl}" target="_blank" class="btn btn-primary" style="text-decoration: none; display: inline-flex;">Open Preview in New Tab</a>
          </div>
        `;
        
        previewWrapper.style.display = 'block';
        btn.disabled  = false;
        btn.innerHTML = origHTML;
      } else {
        pdf.save(filename);
        statusEl.className = 'status success fade-in';
        statusEl.innerHTML  = '<div class="status-dot"></div>PDF downloaded successfully!';
        btn.disabled  = false;
        btn.innerHTML = origHTML;
      }
    }).catch(err => {
      btn.disabled  = false;
      btn.innerHTML = origHTML;
      if (action === 'save') {
        statusEl.className = 'status error fade-in';
        statusEl.innerHTML  = `<div class="status-dot"></div>Error: ${err.message}`;
      } else {
        alert('Error: ' + err.message);
      }
    });
  }
  </script>
</body>
</html>
